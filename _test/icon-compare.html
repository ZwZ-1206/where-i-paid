<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #EDF0F7; padding: 24px 22px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  .row { display: flex; gap: 26px; justify-content: center; }
  .col { width: 300px; background: #fff; border: 1px solid #E6EAF4; border-radius: 16px; padding: 16px; }
  .col.pick { border-color: #C9D8FF; box-shadow: 0 8px 22px rgba(79,124,255,.13); }
  h3 { font-size: 13px; font-weight: 800; color: #2B3348; margin-bottom: 2px; }
  .sub { font-size: 10.5px; color: #8A93A6; margin-bottom: 12px; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; }
  .sizes div { text-align: center; }
  .sz { font-size: 9.5px; color: #A9B0C0; margin-top: 5px; }
  .ic { border-radius: 22.6%; display: block; }
  .home { margin-top: 14px; padding: 14px 10px; background: linear-gradient(160deg,#E8ECF7,#F4F6FC); border-radius: 13px; display: flex; gap: 16px; justify-content: center; }
  .homeitem { text-align: center; }
  .homeitem .lbl { font-size: 9px; color: #4A5265; margin-top: 4px; }
  .note { font-size: 10.5px; color: #7C8598; line-height: 1.6; margin-top: 12px; }
  .foot { text-align: center; font-size: 12px; color: #6C7488; margin-top: 16px; line-height: 1.7; }
  .foot b { color: #2B3348; }
</style>
</head>
<body>
<div class="row">

  <!-- 现在 -->
  <div class="col">
    <h3>现在用的</h3>
    <div class="sub">钱包 + ¥ ——「这是个记账本」</div>

      <div><svg class="ic" width="64" height="64" viewBox="0 0 512 512"><defs><linearGradient id="gA2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".52" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#gA2)"/><circle cx="410" cy="104" r="92" fill="#fff" opacity=".09"/><circle cx="96" cy="430" r="66" fill="#fff" opacity=".07"/><rect x="96" y="150" width="320" height="212" rx="48" fill="#fff"/><path d="M96 214h320" stroke="#B9AEFF" stroke-opacity=".55" stroke-width="8"/><rect x="306" y="248" width="110" height="66" rx="33" fill="#7C5CFF" opacity=".16"/><circle cx="361" cy="281" r="15" fill="#7C5CFF"/><g fill="none" stroke="#7C5CFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><path d="M146 248l34 36 34-36"/><path d="M180 284v48"/><path d="M150 302h60"/><path d="M150 326h60"/></g></svg><div class="sz">64</div></div>
      <div><svg class="ic" width="44" height="44" viewBox="0 0 512 512"><defs><linearGradient id="gA3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".52" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#gA3)"/><circle cx="410" cy="104" r="92" fill="#fff" opacity=".09"/><circle cx="96" cy="430" r="66" fill="#fff" opacity=".07"/><rect x="96" y="150" width="320" height="212" rx="48" fill="#fff"/><path d="M96 214h320" stroke="#B9AEFF" stroke-opacity=".55" stroke-width="8"/><rect x="306" y="248" width="110" height="66" rx="33" fill="#7C5CFF" opacity=".16"/><circle cx="361" cy="281" r="15" fill="#7C5CFF"/><g fill="none" stroke="#7C5CFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><path d="M146 248l34 36 34-36"/><path d="M180 284v48"/><path d="M150 302h60"/><path d="M150 326h60"/></g></svg><div class="sz">44</div></div>
    </div>
    <div class="home">
      <div class="homeitem">
        <svg class="ic" width="46" height="46" viewBox="0 0 512 512"><defs><linearGradient id="gA4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".52" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#gA4)"/><rect x="96" y="150" width="320" height="212" rx="48" fill="#fff"/><path d="M96 214h320" stroke="#B9AEFF" stroke-opacity=".55" stroke-width="8"/><rect x="306" y="248" width="110" height="66" rx="33" fill="#7C5CFF" opacity=".16"/><circle cx="361" cy="281" r="15" fill="#7C5CFF"/><g fill="none" stroke="#7C5CFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><path d="M146 248l34 36 34-36"/><path d="M180 284v48"/><path d="M150 302h60"/><path d="M150 326h60"/></g></svg>
        <div class="lbl">花哪儿了</div>
      </div>
      <div class="homeitem">
        <div style="width:46px;height:46px;border-radius:11px;background:#DDE3F0"></div>
        <div class="lbl">其他</div>
      </div>
      <div class="homeitem">
        <div style="width:46px;height:46px;border-radius:11px;background:#DDE3F0"></div>
        <div class="lbl">其他</div>
      </div>
    </div>
    <div class="note">好处：一眼知道是记账。坏处：和「花哪儿了」这个名字没什么关系，任何记账 App 都能用。</div>
  </div>

  <!-- 提议 -->
  <div class="col pick">
    <h3>要不要换成这个</h3>
    <div class="sub">放大镜 ——「钱到底去哪儿了」</div>
    <div class="sizes">
      <div><svg class="ic" width="128" height="128" viewBox="0 0 512 512"><defs><linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".52" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#gB)"/><circle cx="410" cy="104" r="92" fill="#fff" opacity=".09"/><circle cx="96" cy="430" r="66" fill="#fff" opacity=".07"/><circle cx="226" cy="222" r="104" fill="none" stroke="#fff" stroke-width="38"/><path d="M302 298l74 74" stroke="#fff" stroke-width="42" stroke-linecap="round"/><g fill="none" stroke="#E6DEFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M198 196l28 30 28-30"/><path d="M226 226v44"/><path d="M202 240h48"/></g></svg><div class="sz">128</div></div>
      <div><svg class="ic" width="64" height="64" viewBox="0 0 512 512"><defs><linearGradient id="gB2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".52" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#gB2)"/><circle cx="410" cy="104" r="92" fill="#fff" opacity=".09"/><circle cx="96" cy="430" r="66" fill="#fff" opacity=".07"/><circle cx="226" cy="222" r="104" fill="none" stroke="#fff" stroke-width="38"/><path d="M302 298l74 74" stroke="#fff" stroke-width="42" stroke-linecap="round"/><g fill="none" stroke="#E6DEFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M198 196l28 30 28-30"/><path d="M226 226v44"/><path d="M202 240h48"/></g></svg><div class="sz">64</div></div>
      <div><svg class="ic" width="44" height="44" viewBox="0 0 512 512"><defs><linearGradient id="gB3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".52" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#gB3)"/><circle cx="410" cy="104" r="92" fill="#fff" opacity=".09"/><circle cx="96" cy="430" r="66" fill="#fff" opacity=".07"/><circle cx="226" cy="222" r="104" fill="none" stroke="#fff" stroke-width="38"/><path d="M302 298l74 74" stroke="#fff" stroke-width="42" stroke-linecap="round"/><g fill="none" stroke="#E6DEFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M198 196l28 30 28-30"/><path d="M226 226v44"/><path d="M202 240h48"/></g></svg><div class="sz">44</div></div>
    </div>
    <div class="home">
      <div class="homeitem">
        <svg class="ic" width="46" height="46" viewBox="0 0 512 512"><defs><linearGradient id="gB4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".52" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#gB4)"/><circle cx="226" cy="222" r="104" fill="none" stroke="#fff" stroke-width="38"/><path d="M302 298l74 74" stroke="#fff" stroke-width="42" stroke-linecap="round"/><g fill="none" stroke="#E6DEFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M198 196l28 30 28-30"/><path d="M226 226v44"/><path d="M202 240h48"/></g></svg>
        <div class="lbl">花哪儿了</div>
      </div>
      <div class="homeitem">
        <div style="width:46px;height:46px;border-radius:11px;background:#DDE3F0"></div>
        <div class="lbl">其他</div>
      </div>
      <div class="homeitem">
        <div style="width:46px;height:46px;border-radius:11px;background:#DDE3F0"></div>
        <div class="lbl">其他</div>
      </div>
    </div>
    <div class="note">好处：名字和图标说的是同一件事。坏处：放大镜在工具类里太常见，辨识度不如钱包。</div>
  </div>

</div>
<div class="foot">
  名字已经改成「花哪儿了」，图标<b>先没动</b>—— 这个得你点头我才换，因为它是你手机上最常看见的那一格
</div>

</html>
