<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

  .row { display: flex; gap: 22px; justify-content: center; align-items: flex-start; }
  .col { width: 390px; }

  .cap em { font-style: normal; color: #7C5CFF; font-weight: 700; }
  .cap i { font-style: normal; color: #E2536B; font-weight: 700; }
  .phone { width: 390px; border-radius: 22px; overflow: hidden; background: #F7F8FC; border: 1px solid #E3E7F0; box-shadow: 0 10px 30px rgba(20,30,60,.09); }

  .topbar { height: 52px; display: flex; align-items: center; padding: 0 12px 0 16px; background: #FCFDFF; border-bottom: 1px solid #EDF0F6; }
  .tbtitle { font-size: 17px; font-weight: 700; color: #1D2437; letter-spacing: .01em; flex: 1; }
  .tbicons { display: flex; gap: 6px; }
  .tbbtn { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: #F1F4FA; color: #7B8499; position: relative; }
  .dot { position: absolute; top: -2px; right: -2px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: #FF5A5F; color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; }

  .body { height: 236px; padding: 14px 16px; background: linear-gradient(180deg,#FCFDFF,#F3F5FB); }
  .sk { border-radius: 6px; background: #DFE5F0; }
  .sk.a { height: 10px; width: 40%; }
  .sk.b { height: 10px; width: 68%; background: #E8ECF5; margin-top: 9px; }
  .sk.c { height: 10px; width: 54%; background: #E8ECF5; margin-top: 9px; }
  .sk.d { height: 10px; width: 33%; background: #E8ECF5; margin-top: 9px; }
  .sk.e { height: 10px; width: 60%; background: #E8ECF5; margin-top: 9px; }

  .tabbar { position: relative; height: 60px; display: flex; align-items: center; background: rgba(255,255,255,.95); border-top: 1px solid #E6EAF4; }
  .tab { flex: 1; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #98A1B4; }
  .tab.active { color: #4F7CFF; }
  .tab-ic { display: grid; place-items: center; height: 22px; }
  .tab-label { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; }
  .tab--main { flex: 1.08; }
  .tab-fab { width: 50px; height: 50px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg,#5B8CFF,#7C5CFF 55%,#A56CFF); color: #fff; box-shadow: 0 8px 22px rgba(79,124,255,.42); margin-top: -22px; }
  .tab--main .tab-label { margin-top: 2px; }

  /* 第三栏：明细页功能量 */
  .mini { padding: 12px 14px; background: #F7F8FC; height: 236px; }
  .mcard { border-radius: 12px; background: linear-gradient(135deg,#5B8CFF,#7C5CFF 60%,#A56CFF); height: 52px; margin-bottom: 8px; }
  .mrow { display: flex; gap: 7px; margin-bottom: 7px; }
  .mchip { height: 20px; border-radius: 10px; background: #E6EAF4; }
  .mlist { border-radius: 10px; background: #fff; border: 1px solid #EAEEF7; height: 34px; margin-bottom: 6px; }

  .note { text-align: center; font-size: 11.5px; color: #8A93A6; margin-top: 13px; }
  .note b { color: #2B3348; }
