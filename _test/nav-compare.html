<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>入口方案对比</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #EDF0F7; padding: 26px 22px 30px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; gap: 22px; justify-content: center; align-items: flex-start; }
  .col { width: 390px; }
  .cap { text-align: center; margin-bottom: 9px; }
  .cap b { font-size: 14px; font-weight: 700; color: #2B3348; letter-spacing: .01em; }
  .cap span { display: block; font-size: 11.5px; color: #8A93A6; margin-top: 3px; }
  .cap em { font-style: normal; color: #7C5CFF; font-weight: 600; }
  .phone {
    width: 390px; border-radius: 24px; overflow: hidden;
    background: #F7F8FC; border: 1px solid #E3E7F0;
    box-shadow: 0 10px 30px rgba(20, 30, 60, .09);
  }
  .page { height: 108px; padding: 15px 18px; background: linear-gradient(180deg, #FCFDFF, #F3F5FB); }
  .sk { border-radius: 6px; background: #DFE5F0; }
  .sk.a { height: 10px; width: 42%; }
  .sk.b { height: 10px; width: 66%; background: #E8ECF5; margin-top: 10px; }
  .sk.c { height: 10px; width: 52%; background: #E8ECF5; margin-top: 10px; }
  .sk.d { height: 10px; width: 30%; background: #E8ECF5; margin-top: 10px; }

  .tabbar {
    position: relative; height: 60px; display: flex; align-items: center;
    background: rgba(255, 255, 255, .92); border-top: 1px solid #E6EAF4;
  }
  .tab { flex: 1; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #98A1B4; }
  .tab.active { color: #4F7CFF; }
  .tab-ic { display: grid; place-items: center; height: 22px; }
  .tab-label { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; }
  .tab--main { flex: 1.08; }
  .tab-fab {
    width: 50px; height: 50px; border-radius: 18px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5B8CFF 0%, #7C5CFF 55%, #A56CFF 100%);
    color: #fff; box-shadow: 0 8px 22px rgba(79, 124, 255, .42); margin-top: -22px;
  }
  .tab--main .tab-label { margin-top: 2px; }
  .tab--main.active { color: #4F7CFF; }
  .note { text-align: center; font-size: 11.5px; color: #8A93A6; margin-top: 14px; }
  .note b { color: #2B3348; }
</style>
</head>
<body>
<div class="row">

  <!-- 现状 -->
  <div class="col">
    <div class="cap"><b>现状</b><span>凸起 FAB 放的是「总结」</span></div>
    <div class="phone">
      <div class="page"><div class="sk a"></div><div class="sk b"></div><div class="sk c"></div><div class="sk d"></div></div>
      <div class="tabbar">
        <div class="tab active"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span><span class="tab-label">记一笔</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.8" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.8" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.8" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
        </span><span class="tab-label">明细</span></div>
        <div class="tab tab--main"><span class="tab-fab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3a9 9 0 109 9h-9V3z"/><path d="M14 2.5A9 9 0 0121.5 10H14V2.5z"/></svg>
        </span><span class="tab-label">总结</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
        </span><span class="tab-label">目标</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007.5 19.3a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 003.14 15a1.7 1.7 0 00-1.55-1H1.5a2 2 0 110-4h.1A1.7 1.7 0 003.14 8.5a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 007.5 4.14 1.7 1.7 0 008.5 2.6V2.5a2 2 0 114 0v.1a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.55 1z"/></svg>
        </span><span class="tab-label">设置</span></div>
      </div>
    </div>
  </div>

  <!-- 方案 A -->
  <div class="col">
    <div class="cap"><b>方案 A</b><span>只把「目标」换成 <em>我们</em></span></div>
    <div class="phone">
      <div class="page"><div class="sk a"></div><div class="sk b"></div><div class="sk c"></div><div class="sk d"></div></div>
      <div class="tabbar">
        <div class="tab active"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span><span class="tab-label">记一笔</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.8" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.8" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.8" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
        </span><span class="tab-label">明细</span></div>
        <div class="tab tab--main"><span class="tab-fab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3a9 9 0 109 9h-9V3z"/><path d="M14 2.5A9 9 0 0121.5 10H14V2.5z"/></svg>
        </span><span class="tab-label">总结</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24">
            <defs><linearGradient id="hA" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5B8CFF"/><stop offset=".55" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/>
            </linearGradient></defs>
            <path d="M12 20.4c-.3 0-.6-.1-.8-.3C7.7 17 3.5 13.7 3.5 9.9c0-2.7 2.1-4.7 4.7-4.7 1.6 0 3 .8 3.8 2 .8-1.2 2.2-2 3.8-2 2.6 0 4.7 2 4.7 4.7 0 3.8-4.2 7.1-7.7 10.2-.2.2-.5.3-.8.3z" fill="url(#hA)"/>
          </svg>
        </span><span class="tab-label">我们</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007.5 19.3a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 003.14 15a1.7 1.7 0 00-1.55-1H1.5a2 2 0 110-4h.1A1.7 1.7 0 003.14 8.5a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 007.5 4.14 1.7 1.7 0 008.5 2.6V2.5a2 2 0 114 0v.1a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.55 1z"/></svg>
        </span><span class="tab-label">设置</span></div>
      </div>
    </div>
  </div>

  <!-- 方案 B -->
  <div class="col">
    <div class="cap"><b>方案 B <em>推荐</em></b><span>FAB 还给「记一笔」，目标 → 我们</span></div>
    <div class="phone">
      <div class="page"><div class="sk a"></div><div class="sk b"></div><div class="sk c"></div><div class="sk d"></div></div>
      <div class="tabbar">
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.8" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.8" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.8" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
        </span><span class="tab-label">明细</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3a9 9 0 109 9h-9V3z"/><path d="M14 2.5A9 9 0 0121.5 10H14V2.5z"/></svg>
        </span><span class="tab-label">总结</span></div>
        <div class="tab tab--main"><span class="tab-fab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span><span class="tab-label">记一笔</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24">
            <defs><linearGradient id="hB" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5B8CFF"/><stop offset=".55" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A56CFF"/>
            </linearGradient></defs>
            <path d="M12 20.4c-.3 0-.6-.1-.8-.3C7.7 17 3.5 13.7 3.5 9.9c0-2.7 2.1-4.7 4.7-4.7 1.6 0 3 .8 3.8 2 .8-1.2 2.2-2 3.8-2 2.6 0 4.7 2 4.7 4.7 0 3.8-4.2 7.1-7.7 10.2-.2.2-.5.3-.8.3z" fill="url(#hB)"/>
          </svg>
        </span><span class="tab-label">我们</span></div>
        <div class="tab"><span class="tab-ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007.5 19.3a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 003.14 15a1.7 1.7 0 00-1.55-1H1.5a2 2 0 110-4h.1A1.7 1.7 0 003.14 8.5a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 007.5 4.14 1.7 1.7 0 008.5 2.6V2.5a2 2 0 114 0v.1a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.55 1z"/></svg>
        </span><span class="tab-label">设置</span></div>
      </div>
    </div>
  </div>

</div>

<div class="note">心形是整条 Tab 栏里<b>唯一的彩色实心元素</b> —— 不用加红点，它自己就会跳出来</div>
</body>
</html>
