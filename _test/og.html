<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: #0B0E15;
    color: #EDF1F8;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
      "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  .glow {
    position: absolute; width: 900px; height: 900px; right: -260px; top: -320px;
    background: radial-gradient(circle, rgba(124,92,255,.55) 0%, rgba(124,92,255,0) 62%);
    filter: blur(6px);
  }
  .inner { position: absolute; left: 88px; top: 96px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; border-radius: 18px; }
  .brand span { font-size: 22px; color: #A3AEC2; letter-spacing: .02em; }
  h1 {
    margin-top: 56px;
    font-size: 76px;
    line-height: 1.14;
    font-weight: 600;
    letter-spacing: -.04em;
  }
  p { margin-top: 28px; font-size: 24px; line-height: 1.6; color: #A3AEC2; }
  .phone {
    position: absolute; right: 96px; bottom: -120px; width: 300px; height: 620px;
    border-radius: 44px; background: #171C27;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 40px 90px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .phone img { width: 284px; height: 604px; margin: 8px; border-radius: 36px; object-fit: cover; object-position: top center; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="brand">
      <img src="../assets/icons/icon-192.png" alt="" />
      <span>花哪儿了</span>
    </div>
    <h1>花了多少，<br />花哪儿了</h1>
    <p>不用注册 · 不上传 · 断网也能记</p>
  </div>
  <div class="phone">
    <img src="../site/assets/shots/shot-home.webp" alt="" />
  </div>
</body>
</html>
