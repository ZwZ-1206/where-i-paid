<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>mock2</title>
<style>
  html,body{margin:0;padding:0;width:390px;height:844px;overflow:hidden;background:#F4F6FB;}
  iframe{display:block;width:390px;height:844px;border:0;}
</style>
</head>
<body>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/store.js"></script>
<script>
  var D = 86400000;
  try {
    Store.init();
    Store.seedDemo(true);
    Store.setBudget(600000);                       // 月预算 ¥6000（健康档位）

    /* ---- 情侣账本：真实开通流程的数据态 ---- */
    Store.enableCouple({
      consent: { agreed: true, version: 3 },
      meName: '阿纬', peerName: '小鹿', togetherSince: '2026-06-18',
      mode: 'same', meBirthday: '2004-03-12', peerBirthday: '2004-11-05'
    });
    Store.cpAddTx({ type:'expense', amount:6800,  catId:'food',      sub:'晚餐', note:'火锅 AA',   accountId:'wechat', ts: Date.now()-D*1, attrib:'mutual' });
    Store.cpAddTx({ type:'expense', amount:2380,  catId:'food',      sub:'奶茶', note:'第二杯半价', accountId:'alipay', ts: Date.now()-D*2, attrib:'me' });
    Store.cpAddTx({ type:'expense', amount:15600, catId:'shopping',  sub:'电影', note:'周末档',     accountId:'wechat', ts: Date.now()-D*3, attrib:'peer' });
    Store.cpAddTx({ type:'expense', amount:4200,  catId:'transport', sub:'打车', note:'雨天回家',   accountId:'alipay', ts: Date.now()-D*4, attrib:'mutual' });
    Store.cpAddTx({ type:'expense', amount:8800,  catId:'food',      sub:'午餐', note:'公司食堂',   accountId:'wechat', ts: Date.now()-D*6, attrib:'peer' });
    /* 红包：与真实记账路径一致 —— 归属选「红包」(attrib='redpacket') + rpFrom 记方向 */
    Store.cpAddTx({ type:'expense', amount:880, catId:'redpacket', sub:'红包', note:'生日快乐', accountId:'wechat', ts: Date.now()-D*1, attrib:'redpacket', rpFrom:'peer' });
    Store.cpAddTx({ type:'expense', amount:520, catId:'redpacket', sub:'红包', note:'加班辛苦', accountId:'wechat', ts: Date.now()-D*5, attrib:'redpacket', rpFrom:'peer' });
    try {
      var vault = Store.coupleVault && Store.coupleVault();
      if (vault) Store.depositGoal(vault.id, 200000, '一起存的第一笔');
    } catch (e) {}

    /* ---- 想买清单：冷静中 / 已放弃（避开“已到期”态：该状态下 App 会把同一项
           同时列进「冷静期到了」和「冷静中」，见 view-settings.js:2013-2014） ---- */
    Store.addWish({ name:'降噪耳机', amount:129900, note:'通勤地铁用' });
    Store.addWish({ name:'机械键盘', amount:45900, note:'打字舒服点' });
    var sk = Store.addWish({ name:'限量球鞋', amount:89900, note:'原价抢购' });
    Store.dropWish(sk.id);                                       // 放弃 → 进忍住基金
  } catch (e) { document.title = 'SEED ERR ' + e.message; }

  var v = (location.search.match(/[?&]v=([\w-]+)/) || [])[1] || 'detail';
  var route = v === 'wish' ? 'settings' : (v === 'scan' ? 'add' : v);
  var f = document.createElement('iframe');
  f.src = '../index.html#' + route;
  f.onload = function () {
    var w = f.contentWindow;
    setTimeout(function () {
      try {
        if (v === 'scan') w.Scan.open();
        if (v === 'wish') w.ViewSettings.openWishSheet();
      } catch (e) { document.title = 'ACT ERR ' + e.message; }
    }, 420);
  };
  document.body.appendChild(f);
</script>
</body>
</html>
