<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4F7CFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="花哪儿了 ——极简好用的手机记账本。记下每一笔，就知道钱都花哪儿了。支持自定义记账周期、自定义预算、低预算提醒、月度总结与攒钱目标。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="花哪儿了" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>花哪儿了 · 极简手机记账本</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/app.css?v=1.18.13" />
  <link rel="stylesheet" href="assets/css/couple.css?v=1.18.13" />
  <style>
    /* 浏览器给输入框的「黑色大框」是默认的focus ring（Focus-visible of UA stylesheet），
       全局关掉，统一改成品牌色细描边。这条必须放在所有样式表之后，否则被覆盖。*/
    *:focus,
    *:focus-visible,
    input:focus,
    textarea:focus,
    select:focus,
    button:focus { outline: none !important; }
    input:focus-visible,
    textarea:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 2px var(--brand-soft, rgba(79, 124, 255, .18));
      border-radius: 10px;
    }
    button:focus-visible,
    a:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 2px var(--brand-soft, rgba(79, 124, 255, .28));
    }
  </style>
</head>
<body>
  <!-- 启动闪屏 -->
  <div id="splash" class="splash">
    <img class="splash-logo" src="assets/icons/icon.svg" alt="花哪儿了" />
    <div class="splash-name">花哪儿了</div>
    <div class="splash-tip">正在准备你的账本…</div>
  </div>

  <!-- 应用外壳 -->
  <div id="app" class="app" hidden>
    <header class="topbar" id="topbar"></header>

    <main class="views" id="views">
      <section class="view" id="view-add" data-view="add"></section>
      <section class="view" id="view-detail" data-view="detail"></section>
      <section class="view" id="view-report" data-view="report"></section>
      <section class="view" id="view-goals" data-view="goals"></section>
      <section class="view" id="view-settings" data-view="settings"></section>
      <section class="view" id="view-couple" data-view="couple"></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="detail" type="button">
        <span class="tab-ic" data-ic="list"></span><span class="tab-label">明细</span>
      </button>
      <button class="tab" data-tab="report" type="button">
        <span class="tab-ic" data-ic="pie"></span><span class="tab-label">总结</span>
      </button>
      <button class="tab tab--main" data-tab="add" type="button" aria-label="记一笔">
        <span class="tab-fab" data-ic="plus"></span>
        <span class="tab-label">记一笔</span>
      </button>
      <button class="tab" data-tab="goals" type="button">
        <span class="tab-ic" data-ic="target"></span><span class="tab-label">目标</span>
      </button>
      <button class="tab tab--couple" data-tab="couple" type="button">
        <span class="tab-ic" data-ic="heart"></span><span class="tab-label">情侣</span>
      </button>
    </nav>

    <div class="sheet-root" id="sheet-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <div class="toast-host" id="toast-host"></div>
  </div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:system-ui">请启用 JavaScript 以使用花哪儿了。</div>
  </noscript>

  <!-- ?v= 版本号：改了代码就改这个号，可绕过任何旧缓存（含 Service Worker 的缓存） -->
  <script src="assets/js/icons.js?v=1.18.13"></script>
  <script src="assets/js/utils.js?v=1.18.13"></script>
  <script src="assets/js/charts.js?v=1.18.13"></script>
  <script src="assets/js/store.js?v=1.18.13"></script>
  <script src="assets/js/ui.js?v=1.18.13"></script>
  <script src="assets/js/ai.js?v=1.18.13"></script>
  <script src="assets/js/ocr.js?v=1.18.13"></script>
  <script src="assets/js/extras.js?v=1.18.13"></script>
  <script src="assets/js/tips.js?v=1.18.13"></script>
  <script src="assets/js/scan.js?v=1.18.13"></script>
  <script src="assets/js/pdf-text.js?v=1.18.13"></script>
  <script src="assets/js/bills.js?v=1.18.13"></script>
  <script src="assets/js/remind.js?v=1.18.13"></script>
  <script src="assets/js/couple-sync.js?v=1.18.13"></script>
  <script src="assets/js/view-add.js?v=1.18.13"></script>
  <script src="assets/js/view-detail.js?v=1.18.13"></script>
  <script src="assets/js/view-report.js?v=1.18.13"></script>
  <script src="assets/js/view-goals.js?v=1.18.13"></script>
  <script src="assets/js/view-settings.js?v=1.18.13"></script>
  <script src="assets/js/view-sync.js?v=1.18.13"></script>
  <script src="assets/js/view-couple.js?v=1.18.13"></script>
  <script src="assets/js/app.js?v=1.18.13"></script>

  <!-- 启动兜底：资源没加载上来时，别永远停在「正在准备你的账本…」。
       典型场景：安卓用文件管理器直接点开 index.html，地址是 content://，
       页面里的脚本按相对路径根本加载不到，App 永远不会启动。 -->
  <script>
  (function () {
    var tip = document.querySelector('.splash-tip');
    function say(html) {
      if (!tip) return;
      tip.innerHTML = html;
      tip.style.lineHeight = '1.7';
      tip.style.padding = '0 26px';
    }
    var proto = location.protocol;
    if (proto !== 'http:' && proto !== 'https:' && proto !== 'file:') {
      say('这个打开方式打不开（' + proto + '）。<br>请装安卓版，或者把整个文件夹放到网页服务器上访问。');
      return;
    }
    setTimeout(function () {
      if (window.App) return;
      say('没能启动。<br>如果是在手机上用文件管理器点开的 index.html，这样是不行的，请改用安卓安装包。');
    }, 5000);
  })();
  </script>
</body>
</html>
